[package]
name = "arete-chat-tauri"
version = "0.0.0"
description = "Arete Chat desktop app"
authors = ["Arete"]
edition = "2021"
rust-version = "1.77"

# The library that `main.rs` calls into; also lets integration tests reuse it.
[lib]
name = "arete_chat_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
axum = "0.7"
tokio = { version = "1", features = ["rt-multi-thread", "net", "macros", "sync", "time"] }
tokio-stream = "0.1"
bytes = "1"
tower-http = { version = "0.6", features = ["cors", "limit", "fs"] }
rusqlite = { version = "0.32", features = ["bundled"] }
reqwest = { version = "0.12", features = ["json", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = "0.8"
uuid = { version = "1", features = ["v4"] }
anyhow = "1"
tracing = "0.1"
tracing-appender = "0.2"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
rmcp = { version = "1", features = ["client", "transport-child-process", "transport-streamable-http-client-reqwest", "reqwest-native-tls"] }
# Same reqwest as rmcp (0.13), aliased so we can build/wrap its HTTP client.
reqwest_mcp = { package = "reqwest", version = "0.13" }
futures = "0.3"
sse-stream = "0.2"
regex = "1"

[features]
# default Tauri custom-protocol feature for production builds
custom-protocol = ["tauri/custom-protocol"]
